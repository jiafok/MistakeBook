services:
  mistakebook:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mistakebook-ai:1.1.0
    container_name: mistakebook
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      # --- core ---
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production-please}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/mistakebook.db}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      DEBUG: "${DEBUG:-false}"

      # --- storage: local | nas | minio ---
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      STORAGE_LOCAL_DIR: "${STORAGE_LOCAL_DIR:-/data/storage}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      MINIO_BUCKET: "${MINIO_BUCKET:-mistakebook}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"

      # --- upload limits ---
      MAX_UPLOAD_FILES: "${MAX_UPLOAD_FILES:-500}"
      MAX_FILE_BYTES: "${MAX_FILE_BYTES:-31457280}"
      MAX_PDF_PAGES: "${MAX_PDF_PAGES:-100}"

      # --- OCR: rapidocr (default) | heuristic | paddle | tesseract ---
      OCR_PROVIDER: "${OCR_PROVIDER:-rapidocr}"

      # --- AI: none | openai | deepseek | glm | gemini | claude | ollama ---
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-60}"

      # --- thresholds / review ---
      PROBABILITY_RECOMMEND: "${PROBABILITY_RECOMMEND:-85}"
      PROBABILITY_SUSPECT: "${PROBABILITY_SUSPECT:-50}"
      DEDUP_SIMILARITY_THRESHOLD: "${DEDUP_SIMILARITY_THRESHOLD:-0.90}"
      REVIEW_INTERVALS: "${REVIEW_INTERVALS:-1,3,7,15,30}"
    volumes:
      # Persist database + uploaded originals. Point this at a NAS share if desired.
      - "${DATA_DIR:-./data}:/data"
    # Uncomment when using Ollama running on the Docker host
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Optional: PostgreSQL for larger / multi-user deployments.
  # Enable with: docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    container_name: mistakebook-db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mistakebook}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mistakebook}"
      POSTGRES_DB: "${POSTGRES_DB:-mistakebook}"
    volumes:
      - "${PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mistakebook}"]
      interval: 10s
      timeout: 5s
      retries: 5
